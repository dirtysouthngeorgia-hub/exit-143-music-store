function save(){try{localStorage.setItem(storageKey,JSON.stringify(lists))}catch(e){console.warn('Local storage unavailable',e)}renderLists()}

function renderLists(){
 $('lists').replaceChildren();$('currentPlaylist').textContent=playlistName?'Selected: '+playlistName:'Choose or create a playlist';
 for(let [name,items] of Object.entries(lists)){
  let head=document.createElement('label');head.className='playlist-choice';
  let radio=document.createElement('input');radio.type='radio';radio.name='activePlaylist';radio.checked=name===playlistName;
  radio.onchange=()=>{playlistName=name;renderLists()};
  let title=document.createElement('strong');title.textContent=name+' ('+items.length+')';head.append(radio,title);

  deleteList.setAttribute('aria-label','Delete playlist '+name);

  head.append(deleteList);$('lists').append(head);
  let container=document.createElement('div');container.className='playlist-tracks';$('lists').append(container);

   [...container.children].forEach((r,index)=>{
    r.querySelector('.move-up').disabled=index===0;
    r.querySelector('.move-down').disabled=index===container.children.length-1;
   })
  }
  items.forEach((t,i)=>{
   let row=document.createElement('div');row.className='playlist-row';let label=document.createElement('span');label.textContent=t.title;label.style.flex='1';
   let up=document.createElement('button');up.type='button';up.className='move-up';up.textContent='↑';up.title='Move up';
   let down=document.createElement('button');down.type='button';down.className='move-down';down.textContent='↓';down.title='Move down';
   const move=direction=>{
    let at=[...container.children].indexOf(row),to=at+direction;
    if(to<0||to>=items.length)return;
    [items[at],items[to]]=[items[to],items[at]];
    if(direction<0)container.insertBefore(row,container.children[to]);
    else container.insertBefore(container.children[to],row);
    try{localStorage.setItem(storageKey,JSON.stringify(lists))}catch(e){console.warn('Playlist save failed',e)}
    updateArrows();
    // Keep the moving track's arrow under the pointer for repeated mouse clicks.
    row.scrollIntoView({block:'nearest'});
   };
   up.onclick=()=>move(-1);down.onclick=()=>move(1);
   let del=document.createElement('button');del.type='button';del.textContent='×';del.title='Remove from playlist';
   del.onclick=()=>{let at=[...container.children].indexOf(row);items.splice(at,1);row.remove();save()};
   row.append(label,up,down,del);container.append(row)
  });
  updateArrows();
 }
}
